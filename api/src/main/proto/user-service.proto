syntax = "proto3";

option java_multiple_files = true;
option java_package = "org.pokubuy.userservice.grpc";
option java_outer_classname = "UserServiceProto";

service UserService {
  rpc CreateUser (CreateUserRequest) returns (AuthData);
  rpc AuthenticateUser (AuthenticateUserRequest) returns (AuthData);
  rpc RenewToken (RenewTokenRequest) returns (RenewTokenResponse);
  rpc GetUser(GetUserRequest) returns (UserInfo);
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_CLIENT = 1;
  USER_ROLE_SELLER = 2;
  USER_ROLE_MODERATOR = 3;
  USER_ROLE_SUPPORT = 4;
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  repeated UserRole roles = 4;
}

message AuthenticateUserRequest {
  string email = 1;
  string password = 2;
}

message RenewTokenRequest {
  string refreshToken = 1;
}

message RenewTokenResponse {
  string accessToken = 1;
}

message GetUserRequest {
  string id = 1;
}

message AuthData {
  string accessToken = 1;
  string refreshToken = 2;
}

message UserInfo {
  string username = 1;
  string email = 2;
  repeated UserRole roles = 3;
}