[versions]
lombok = "8.14.1"
reactor = "3.8.8"
javax = "1.3.2"
grpc = "1.85.1"
springDependencyManagement = "1.1.7"
springBoot = "4.1.2"
postgresR2dbc = "1.1.3.RELEASE"
postgres = "42.7.14"
flyway = "13.12.0"
keycloak = "26.0.12"
springGrpc = "1.0.3"
protobufPlugin = "0.10.0"
protobuf = "4.36.2"
protobufProtocGenGrpc = "1.9.1"
reactorGrpc = "1.2.4"

[libraries]
javax-annotation-api = { group = "javax.annotation", name = "javax.annotation-api", version.ref = "javax" }
grpc-all = { group = "io.grpc", name = "grpc-all", version.ref = "grpc" }
reactor-core = { group = "io.projectreactor", name = "reactor-core", version.ref = "reactor" }
spring-boot-starter-webflux = { group = "org.springframework.boot", name = "spring-boot-starter-webflux" }
spring-boot-starter-data-r2dbc = { group = "org.springframework.boot", name = "spring-boot-starter-data-r2dbc" }
postgres-r2dbc = { group = "org.postgresql", name = "r2dbc-postgresql", version.ref = "postgresR2dbc" }
postgres = { group = "org.postgresql", name = "postgresql", version.ref = "postgres" }
flyway-core = { group = "org.flywaydb", name = "flyway-core", version.ref = "flyway" }
flyway-postgres = { group = "org.flywaydb", name = "flyway-database-postgresql", version.ref = "flyway" }
spring-boot-starter-flyway = { group = "org.springframework.boot", name = "spring-boot-starter-flyway" }
keycloak-admin-client = { group = "org.keycloak", name = "keycloak-admin-client", version.ref = "keycloak" }
protobuf-protoc = { group = "com.google.protobuf", name = "protoc", version.ref = "protobuf" }
protobuf-protoc-gen-grpc = { group = "io.grpc", name = "protoc-gen-grpc-java", version.ref = "protobufProtocGenGrpc" }
reactor-grpc = { group = "com.salesforce.servicelibs", name = "reactor-grpc", version.ref = "reactorGrpc" }
reactor-grpc-stub = { group = "com.salesforce.servicelibs", name = "reactor-grpc-stub", version.ref = "reactorGrpc" }
spring-grpc-server-starter = { group = "org.springframework.grpc", name = "spring-grpc-server-spring-boot-starter", version.ref = "springGrpc" }
spring-boot-starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation" }
spring-boot-starter-aspectj = { group = "org.springframework.boot", name = "spring-boot-starter-aspectj" }

[plugins]
lombok = { id = "io.freefair.lombok", version.ref = "lombok" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }